[project]
name = "even-backend"
version = "0.1.0"
description = "Even expense splitter — FastAPI backend (SQLAlchemy, SQLite by default)"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
