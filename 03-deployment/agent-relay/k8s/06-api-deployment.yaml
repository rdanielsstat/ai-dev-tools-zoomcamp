apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay-api
  namespace: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-relay-api
  template:
    metadata:
      labels:
        app: agent-relay-api
    spec:
      # Kubernetes has no built-in "wait for dependency to be healthy"
      # (unlike compose's depends_on condition), so wait for postgres to
      # accept connections before uvicorn's import-time init_db() runs.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U agent_relay; do echo waiting for postgres; sleep 2; done
      containers:
        - name: api
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: agent-relay-db-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
