apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-db-url
  namespace: agent-relay
type: Opaque
stringData:
  # Same credentials as postgres-credentials, assembled into the URL the
  # psycopg3 driver expects. "postgres" is the Service name in
  # 04-postgres-service.yaml, resolved via in-cluster DNS.
  RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
