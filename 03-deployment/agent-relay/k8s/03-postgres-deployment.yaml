apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agent-relay
spec:
  replicas: 1
  # A single ReadWriteOnce PVC can only be mounted by one pod at a time;
  # tear the old pod down before starting the replacement instead of the
  # default rolling update, which would try to run both at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_relay", "-d", "agent_relay"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_relay", "-d", "agent_relay"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
