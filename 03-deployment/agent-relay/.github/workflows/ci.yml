name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Run starter test suite (SQLite)
        run: uv run pytest test_agent_relay.py -v

      - name: Start the API against PostgreSQL
        env:
          # This job has no `container:`, so it runs directly on the
          # runner's own network stack and reaches the postgres service by
          # its published port on localhost, not by service-name DNS.
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "API never became healthy" >&2
          exit 1

      - name: Run the integration test against PostgreSQL
        env:
          LIVE_API_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest test_live_api_integration.py -v

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute a unique image tag
        id: image
        run: |
          tag="$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: agent-relay:$tag"

      - name: Build the image
        run: docker build -t "agent-relay:${{ steps.image.outputs.tag }}" .

      - name: Install kubectl and kind if missing
        run: |
          if ! command -v kubectl >/dev/null; then
            arch="$(uname -m)"; [ "$arch" = "x86_64" ] && arch=amd64 || arch=arm64
            curl -Lo /tmp/kubectl "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/${arch}/kubectl"
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          fi
          if ! command -v kind >/dev/null; then
            arch="$(uname -m)"; [ "$arch" = "x86_64" ] && arch=amd64 || arch=arm64
            curl -Lo /tmp/kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-${arch}"
            chmod +x /tmp/kind
            sudo mv /tmp/kind /usr/local/bin/kind
          fi

      - name: Load the new image into kind
        run: kind load docker-image "agent-relay:${{ steps.image.outputs.tag }}" --name agent-relay

      - name: Point kubectl at the kind cluster
        # This job runs directly on the runner's own network stack (no
        # `container:` key -- under `act` that's real `docker run
        # --network host`, colocated with the Docker daemon and kind's
        # control-plane port), so the same 127.0.0.1-based kubeconfig
        # `kind` already writes for the host works here unmodified.
        run: |
          kind get kubeconfig --name agent-relay > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy the new image
        run: |
          kubectl -n agent-relay set image deployment/agent-relay-api "api=agent-relay:${{ steps.image.outputs.tag }}"
          kubectl -n agent-relay rollout status deployment/agent-relay-api --timeout=120s

      - name: Show the deployed image
        run: kubectl -n agent-relay get deployment agent-relay-api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
